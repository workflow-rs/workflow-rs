[workspace]
resolver = "2"
members = [
    "chrome",
    "core",
    "core/macros",
    "d3",
    "dom",
    "egui",
    "egui/macros",
    "encryption",
    "features",
    "gpt",
    "html",
    "html/macros",
    "http",
    "i18n",
    "log",
    "macro-tools",
    "node",
    "nw",
    "panic-hook",
    "rpc",
    "rpc/macros",
    "serializer",
    "service",
    "store",
    "task",
    "task/macros",
    "terminal",
    "terminal/macros",
    "utils",
    "wasm",
    "wasm/macros",
    "websocket",
    "examples/rpc/client-browser/wasm",
    "examples/rpc/client-native",
    "examples/rpc/client-common",
    "examples/rpc/messages",
    "examples/rpc/server",
    "examples/websocket/client-browser/wasm",
    "examples/websocket/client-common",
    "examples/websocket/client-native",
    "examples/websocket/server",
    "examples/terminal/cli",
    "examples/terminal/native",
    "examples/terminal/wasm",
    "tests/wasm32",
    "tests/wasm32-cast",
]

[workspace.package]
version = "0.19.0"
authors = ["WORKFLOW-RS developers"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.96"
include = ["src/**/*.rs", "Cargo.toml"]
repository = "https://github.com/workflow-rs/workflow-rs"

[workspace.dependencies]

